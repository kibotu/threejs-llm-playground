<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cartoon Planet</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b18; }
  #hud {
    position: fixed; left: 16px; bottom: 16px;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: rgba(255, 255, 255, .82);
    background: rgba(10, 14, 24, .45);
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 10px;
    padding: 10px 14px;
    pointer-events: none;
    user-select: none;
    backdrop-filter: blur(6px);
  }
  #hud b { color: #ffd23f; }
</style>
</head>
<body>
<div id="hud"><b>The Cartoon Planet</b><br>drag&nbsp;=&nbsp;orbit&nbsp;&nbsp;·&nbsp;&nbsp;scroll&nbsp;=&nbsp;zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ */
/* Seeded rng, so the planet is the same one every time you load it  */
/* ------------------------------------------------------------------ */
function mulberry32(seed) {
  return function () {
    let t = (seed += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t = Math.imul(t ^ (t >>> 7), t ^ (t >>> 18)) | 1;
    return ((t + Math.imul(t, t) ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(7);
const R = () => rand();
const Rr = (a, b) => a + rand() * (b - a);

/* ------------------------------------------------------------------ */
/* 3D value noise + fbm, sampled on the sphere (no seams)            */
/* ------------------------------------------------------------------ */
function hash3(i, j, k) {
  let n = (i * 37 + j * 91 + k * 27) | 0;
  n = Math.imul(n, 2651) + 1013;
  n = Math.imul(n ^ (n >>> 15), 7349);
  n = Math.imul(n ^ (n >>> 16), 31403);
  return ((n & 0x7fff) + 1) / 0x7fff;
}
function vnoise(x, y, z) {
  const x0 = Math.floor(x), y0 = Math.floor(y), z0 = Math.floor(z);
  const xf = x - x0, yf = y - y0, zf = z - z0;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const h000 = hash3(x0, y0, z0),   h100 = hash3(x0 + 1, y0, z0);
  const h010 = hash3(x0, y0 + 1, z0), h110 = hash3(x0 + 1, y0 + 1, z0);
  const h001 = hash3(x0, y0, z0 + 1), h101 = hash3(x0 + 1, y0, z0 + 1);
  const h011 = hash3(x0, y0 + 1, z0 + 1), h111 = hash3(x0 + 1, y0 + 1, z0 + 1);
  const a = h000 + (h100 - h000) * u;
  const b = h010 + (h110 - h010) * u;
  const c = h001 + (h101 - h001) * u;
  const d = h011 + (h111 - h011) * u;
  const a1 = a + (b - a) * v;
  const b1 = c + (d - c) * v;
  return a1 + (b1 - a1) * w;
}
function fbm(x, y, z) {
  let sum = 0, amp = 0.5, freq = 2.6, norm = 0;
  for (let i = 0; i < 5; i++) {
    sum += amp * vnoise(x * freq + i * 19.1, y * freq + i * 7.7, z * freq + i * 3.3);
    norm += amp;
    amp *= 0.5;
    freq *= 2.1;
  }
  return sum / norm; // ~[0,1]
}
const WATERLINE = 0.55;
const heightAt = (d) => fbm(d.x * 3.2 + 11.3, d.y * 3.2 - 4.7, d.z * 3.2 + 7.9);
const detailAt = (d) => vnoise(d.x * 14 + 31.4, d.y * 14 + 12.9, d.z * 14 + 55.2);
const detailAt2 = (d) => vnoise(d.x * 11 - 7.2, d.y * 11 + 23.6, d.z * 11 - 41.9);

/* ------------------------------------------------------------------ */
/* Renderer / scene                                                    */
/* ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color('#070b18');

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 400);
camera.position.set(15, 6, 21);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ?close in the URL frames the planet up tight, handy for inspecting details
if (new URLSearchParams(location.search).has('close')) {
  camera.position.set(0, 3, 17.5);
}
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 12.5;
controls.maxDistance = 55;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.target.set(0, 0.5, 0);

/* ------------------------------------------------------------------ */
/* Lights                                                              */
/* ------------------------------------------------------------------ */
const sunDir = new THREE.Vector3(0.75, 0.45, 0.5).normalize();
const sun = new THREE.DirectionalLight('#fff3df', 1.1);
sun.position.copy(sunDir).multiplyScalar(30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 5;
sun.shadow.camera.far = 60;
sun.shadow.camera.left = sun.shadow.camera.bottom = -22;
sun.shadow.camera.right = sun.shadow.camera.top = 22;
sun.shadow.bias = -0.0002;
scene.add(sun);
scene.add(new THREE.HemisphereLight('#bfe0ff', '#5a4a3a', 0.4));
scene.add(new THREE.AmbientLight('#ffffff', 0.12));

// visible sun disc + glow
const sunBall = new THREE.Mesh(
  new THREE.SphereGeometry(4, 24, 16),
  new THREE.MeshBasicMaterial({ color: '#ffd93b' })
);
sunBall.position.copy(sunDir).multiplyScalar(110);
scene.add(sunBall);
const glowCanvas = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, 'rgba(255,225,120,0.9)');
  grad.addColorStop(0.35, 'rgba(255,210,90,0.25)');
  grad.addColorStop(1, 'rgba(255,200,60,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  return c;
})();
const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: new THREE.CanvasTexture(glowCanvas),
  blending: THREE.AdditiveBlending, depthTest: false
}));
sunGlow.scale.setScalar(40);
sunGlow.position.copy(sunBall.position);
scene.add(sunGlow);

/* ------------------------------------------------------------------ */
/* Stars                                                               */
/* ------------------------------------------------------------------ */
{
  const n = 1200;
  const pos = new Float32Array(n * 3);
  const col = new Float32Array(n * 3);
  const white = new THREE.Color('#ffffff');
  for (let i = 0; i < n; i++) {
    const d = new THREE.Vector3().randomDirection();
    pos[i * 3]     = d.x * 190;
    pos[i * 3 + 1] = d.y * 190;
    pos[i * 3 + 2] = d.z * 190;
    const c = white.clone().offsetHSL((R() - 0.5) * 0.15, 0.4, R() * 0.3);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    size: 1.6, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: 0.9
  })));
}

/* ------------------------------------------------------------------ */
/* The planet: displaced sphere + cartoon vertex colors               */
/* ------------------------------------------------------------------ */
const R_PLANET = 10;
const terrainGeo = new THREE.SphereGeometry(R_PLANET, 320, 320);
{
  const pos = terrainGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const v = new THREE.Vector3();
  const c = new THREE.Color();
  const deep   = new THREE.Color('#2a6fd8');
  const shall  = new THREE.Color('#4aa8e8');
  const sand   = new THREE.Color('#f0c050');
  const grassDark  = new THREE.Color('#3f7d3d');
  const grassLight = new THREE.Color('#578f42');
  const moss   = new THREE.Color('#2f6b30');
  const sand2  = new THREE.Color('#8f9e3a');
  const rock   = new THREE.Color('#9a8a6f');
  const snow   = new THREE.Color('#ffffff');
  const smooth = (a, b, x) => { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); };

  for (let i = 0; i < pos.count; i++) {
    v.set(pos.getX(i), pos.getY(i), pos.getZ(i)).normalize();
    const h = heightAt(v);
    const det = detailAt(v);
    let r = R_PLANET;
    if (h < WATERLINE) {
      const prox = Math.min(1, (h - (WATERLINE - 0.06)) / 0.06);
      c.copy(deep).lerp(shall, prox);
      if (WATERLINE - h < 0.014) c.lerp(sand, 0.65);
    } else {
      const t = (h - WATERLINE) / (1 - WATERLINE);
      r = R_PLANET + Math.pow(t, 1.6) * 1.35;
      // base dark green, brightened by independent noise so no uniform slab
      const bright = detailAt2(v);
      c.copy(grassDark).lerp(grassLight, bright * 0.8);
      c.lerp(moss, det * 0.7);
      c.lerp(sand2, Math.max(0, 0.5 - bright) * 0.4);
      c.lerp(sand, 1 - smooth(0.0, 0.09, t));           // shoreline
      c.lerp(rock, smooth(0.55, 0.8, t));               // mountains
      c.lerp(snow, smooth(0.78, 0.92, t));              // peaks
    }
    // little per-vertex jitter for a hand-painted feel
    c.multiplyScalar(0.96 + 0.04 * det);
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
    pos.setXYZ(i, v.x * r, v.y * r, v.z * r);
  }
  terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  terrainGeo.computeVertexNormals();
}

const planetGroup = new THREE.Group();
scene.add(planetGroup);

const terrain = new THREE.Mesh(
  terrainGeo,
  new THREE.MeshStandardMaterial({
    vertexColors: true, flatShading: false, roughness: 1.0, metalness: 0.0
  })
);
terrain.castShadow = terrain.receiveShadow = true;
planetGroup.add(terrain);

// atmosphere halo
planetGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(R_PLANET + 0.38, 64, 64),
  new THREE.MeshBasicMaterial({
    color: '#7fc4ff', side: THREE.BackSide, transparent: true,
    opacity: 0.13, blending: THREE.AdditiveBlending, depthWrite: false
  })
));

/* ------------------------------------------------------------------ */
/* A spot on the land, given its direction                             */
/* ------------------------------------------------------------------ */
function surfacePoint(d) {
  const h = heightAt(d);
  const t = (h - WATERLINE) / (1 - WATERLINE);
  const r = R_PLANET + Math.pow(Math.max(0, t), 1.6) * 1.35;
  return d.clone().multiplyScalar(r);
}

/* ------------------------------------------------------------------ */
/* Cities                                                              */
/* ------------------------------------------------------------------ */
const facadePalette = ['#d8dce4', '#b9c4d6', '#e8e2d6', '#c9b8a4', '#a9c2d8'];

function windowTexture(facade) {
  const w = 128, h = 256;
  const map = document.createElement('canvas'); map.width = w; map.height = h;
  const emissive = document.createElement('canvas'); emissive.width = w; emissive.height = h;
  const gm = map.getContext('2d'), ge = emissive.getContext('2d');
  gm.fillStyle = facade; gm.fillRect(0, 0, w, h);
  const cols = 5, rows = 12;
  for (let r = 0; r < rows; r++) {
    for (let cCol = 0; cCol < cols; cCol++) {
      const lit = R() > 0.25;
      const x = 12 + cCol * 24, y = 12 + r * 20, cw = 16, ch = 14;
      gm.fillStyle = lit ? '#ffd86b' : '#2b3644';
      gm.fillRect(x, y, cw, ch);
      ge.fillStyle = lit ? '#ffd86b' : '#000000';
      ge.fillRect(x, y, cw, ch);
    }
  }
  const tMap = new THREE.CanvasTexture(map);
  const tEm = new THREE.CanvasTexture(emissive);
  tMap.colorSpace = tEm.colorSpace = THREE.SRGBColorSpace;
  return { map: tMap, emissive: tEm };
}

function makeCity(d) {
  const group = new THREE.Group();
  group.position.copy(surfacePoint(d));
  group.lookAt(d.clone().multiplyScalar(R_PLANET * 3)); // +Z outward
  group.rotateX(Math.PI / 2); // now +Y is outward (buildings stand up)
  group.castShadow = group.receiveShadow = true;

  // ring road (torus lies flat in the local XZ plane)
  const road = new THREE.Mesh(
    new THREE.TorusGeometry(1.5, 0.055, 12, 64),
    new THREE.MeshStandardMaterial({ color: '#5b5f66', roughness: 0.95 })
  );
  road.rotation.x = Math.PI / 2;
  road.receiveShadow = true;
  group.add(road);
  // little plaza
  group.add(new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.34, 0.06, 24),
    new THREE.MeshStandardMaterial({ color: '#cfd3da', roughness: 0.9 })
  ));

  // buildings
  const facades = facadePalette.map(fc => windowTexture(fc));
  const n = 8 + Math.floor(R() * 6);
  for (let i = 0; i < n; i++) {
    const a = R() * Math.PI * 2, dist = 0.42 + R() * 0.62;
    const bw = 0.13 + R() * 0.1, bh = 0.22 + R() * 0.6;
    const tex = facades[Math.floor(R() * facades.length)];
    const b = new THREE.Mesh(
      new THREE.BoxGeometry(bw, bh, bw),
      new THREE.MeshStandardMaterial({
        map: tex.map, emissiveMap: tex.emissive,
        emissive: new THREE.Color('#ffffff'), emissiveIntensity: 0.35,
        roughness: 0.9
      })
    );
    b.position.set(Math.cos(a) * dist, bh / 2 - 0.01, Math.sin(a) * dist);
    b.rotation.y = -a;
    b.castShadow = true;
    group.add(b);
  }
  // a radio tower
  const tower = new THREE.Mesh(
    new THREE.CylinderGeometry(0.02, 0.035, 1.0, 10),
    new THREE.MeshStandardMaterial({ color: '#8a94a6', roughness: 0.8 })
  );
  tower.position.set(0.75, 0.5, -0.55);
  tower.castShadow = true;
  group.add(tower);
  const beacon = new THREE.Mesh(
    new THREE.SphereGeometry(0.03, 10, 8),
    new THREE.MeshBasicMaterial({ color: '#ff5b5b' })
  );
  beacon.position.set(0.75, 1.03, -0.55);
  group.add(beacon);

  return group;
}

const cities = [];
for (let i = 0; i < 6; i++) {
  let dir;
  for (let tries = 0; tries < 400; tries++) {
    dir = new THREE.Vector3().randomDirection();
    if (Math.abs(Math.asin(THREE.MathUtils.clamp(dir.y, -1, 1))) > THREE.MathUtils.degToRad(78)) continue;
    const h = heightAt(dir);
    if (h < 0.565 || h > 0.72) continue;
    if (cities.every(cd => cd.dot(dir) < 0.78)) break;
  }
  cities.push(dir);
  planetGroup.add(makeCity(dir));
}

/* ------------------------------------------------------------------ */
/* Trees                                                               */
/* ------------------------------------------------------------------ */
{
  const trunkGeo = new THREE.CylinderGeometry(0.018, 0.03, 0.1, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color: '#7a4f2a', roughness: 1 });
  const leafGeo = new THREE.ConeGeometry(0.07, 0.22, 7);
  const leafMat = new THREE.MeshStandardMaterial({ color: '#2f9e3f', roughness: 0.9, flatShading: true });
  const treeGroup = new THREE.Group();
  const d = new THREE.Vector3();
  for (let i = 0; i < 140; i++) {
    const p = new THREE.Vector3().randomDirection();
    const h = heightAt(p);
    const t = (h - WATERLINE) / (1 - WATERLINE);
    if (h < WATERLINE || t < 0.03 || t > 0.5) { i--; continue; }
    if (cities.some(cd => cd.dot(p) > 0.9)) { i--; continue; }
    const s = 0.8 + R() * 0.6;
    const tree = new THREE.Group();
    tree.scale.setScalar(s);
    const trunk = new THREE.Mesh(trunkGeo, trunkMat); trunk.position.y = 0.05; trunk.castShadow = true;
    const leaf = new THREE.Mesh(leafGeo, leafMat); leaf.position.y = 0.2; leaf.castShadow = true;
    tree.add(trunk, leaf);
    tree.position.copy(d.copy(p).multiplyScalar(surfacePoint(p).length()));
    tree.lookAt(p.clone().multiplyScalar(30));
    tree.rotateX(Math.PI / 2); // trunks point outward, not tangentially
    tree.rotation.x += Rr(-0.12, 0.12); tree.rotation.z += Rr(-0.12, 0.12);
    treeGroup.add(tree);
  }
  planetGroup.add(treeGroup);
}

/* ------------------------------------------------------------------ */
/* Cars, cruising their ring roads                                     */
/* ------------------------------------------------------------------ */
const carColors = ['#e74c3b', '#f1c40f', '#2e86d0', '#ffffff', '#35c4b0'];
const carBodyGeo = new THREE.BoxGeometry(0.14, 0.09, 0.22);
const carCabGeo = new THREE.BoxGeometry(0.11, 0.09, 0.11);
const carWheelGeo = new THREE.CylinderGeometry(0.022, 0.022, 0.03, 8);
const cars = [];

function makeCar(color) {
  const car = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, flatShading: true });
  const body = new THREE.Mesh(carBodyGeo, mat);
  body.position.y = 0.07; body.castShadow = true;
  const cab = new THREE.Mesh(carCabGeo, mat);
  cab.position.set(0, 0.15, -0.02); cab.castShadow = true;
  const wheelMat = new THREE.MeshStandardMaterial({ color: '#1d222b', roughness: 0.4 });
  const wheels = [];
  for (const [x, z] of [[-0.065, 0.08], [0.065, 0.08], [-0.065, -0.08], [0.065, -0.08]]) {
    const w = new THREE.Mesh(carWheelGeo, wheelMat);
    w.position.set(x, 0.05, z);
    w.rotation.x = Math.PI / 2;
    wheels.push(w); car.add(w);
  }
  car.add(body, cab);
  return car;
}

cities.forEach(dir => {
  const ring = new THREE.Group();
  ring.position.copy(surfacePoint(dir));
  ring.lookAt(dir.clone().multiplyScalar(R_PLANET * 3));
  ring.rotateX(Math.PI / 2); // local XZ plane is now tangent to the surface
  const count = 3 + Math.floor(R() * 2);
  for (let i = 0; i < count; i++) {
    ring.add(makeCar(carColors[Math.floor(R() * carColors.length)]));
  }
  planetGroup.add(ring);
  cars.push({
    ring,
    cars: ring.children,
    speed: Rr(0.3, 0.55),
    offset: R() * Math.PI * 2,
    base: R() * Math.PI * 2,
  });
});
// cars drive: update in animate()

/* ------------------------------------------------------------------ */
/* Clouds                                                              */
/* ------------------------------------------------------------------ */
const cloudMat = new THREE.MeshStandardMaterial({
  color: '#ffffff', flatShading: true, roughness: 1,
  emissive: '#dfe9ff', emissiveIntensity: 0.25
});
const cloudGroup = new THREE.Group();
scene.add(cloudGroup);
function makeCloud(lat, lon, altitude) {
  const puff = new THREE.Group();
  const n = 4 + Math.floor(R() * 3);
  for (let i = 0; i < n; i++) {
    const s = new THREE.Mesh(
      new THREE.SphereGeometry(Rr(0.28, 0.55), 12, 10),
      cloudMat
    );
    s.position.set(Rr(-0.7, 0.7), Rr(-0.12, 0.18), Rr(-0.5, 0.5));
    s.castShadow = true;
    puff.add(s);
  }
  puff.position.set(
    Math.cos(lat) * Math.cos(lon), Math.sin(lat), Math.cos(lat) * Math.sin(lon)
  ).multiplyScalar(R_PLANET + altitude);
  puff.lookAt(new THREE.Vector3());
  puff.rotateX(Math.PI / 2);
  return puff;
}
for (let i = 0; i < 14; i++) {
  cloudGroup.add(makeCloud(Rr(-1.1, 1.1), R() * Math.PI * 2, Rr(1.7, 2.3)));
}

/* ------------------------------------------------------------------ */
/* Airplanes                                                           */
/* ------------------------------------------------------------------ */
function makePlane() {
  const g = new THREE.Group();
  const white = new THREE.MeshStandardMaterial({ color: '#f4f6f8', roughness: 0.5, flatShading: true });
  const red = new THREE.MeshStandardMaterial({ color: '#e74c3b', roughness: 0.5, flatShading: true });
  const dark = new THREE.MeshStandardMaterial({ color: '#2b3644', roughness: 0.6 });

  const fuselage = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.7, 6, 14), white);
  fuselage.rotation.x = Math.PI / 2; fuselage.castShadow = true; g.add(fuselage);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), red);
  nose.position.z = 0.47; nose.castShadow = true; g.add(nose);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.035, 0.24), red);
  wing.position.set(0, 0.1, 0.06); wing.castShadow = true; g.add(wing);
  const tailV = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.22, 0.16), red);
  tailV.position.set(0, 0.12, -0.32); tailV.castShadow = true; g.add(tailV);
  const tailH = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.03, 0.15), white);
  tailH.position.set(0, 0.09, -0.32); g.add(tailH);

  const prop = new THREE.Group();
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.26, 0.03), dark);
  blade.position.y = 0.13; prop.add(blade);
  for (let i = 0; i < 3; i++) {
    const b = new THREE.Mesh(blade.geometry, dark);
    b.position.copy(blade.position);
    b.rotation.z = (i * Math.PI) / 3;
    prop.add(b);
  }
  prop.position.z = 0.52;
  g.add(prop);
  g.userData.prop = prop;
  return g;
}

const planes = [];
for (let i = 0; i < 3; i++) {
  const plane = makePlane();
  scene.add(plane);
  planes.push({
    mesh: plane,
    lat: Rr(-0.9, 0.9),
    theta: R() * Math.PI * 2,
    speed: Rr(0.09, 0.15) * (R() > 0.5 ? 1 : -1),
    radius: 13.2,
  });
}

/* ------------------------------------------------------------------ */
/* Animate                                                             */
/* ------------------------------------------------------------------ */
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  planetGroup.rotation.y += 0.015 * dt;
  cloudGroup.rotation.y += 0.045 * dt;

  // cars around their ring roads
  for (const c of cars) {
    for (let i = 0; i < c.cars.length; i++) {
      const theta = t * c.speed + c.offset + (i * Math.PI * 2) / c.cars.length + c.base;
      const car = c.cars[i];
      car.position.set(Math.cos(theta) * 1.5, 0.03, Math.sin(theta) * 1.5);
      car.rotation.y = -theta;
    }
  }

  // airplanes
  for (const p of planes) {
    p.theta += p.speed * dt;
    const lat = p.lat + Math.sin(t * 0.3 + p.theta) * 0.06;
    tmp.set(
      Math.cos(lat) * Math.cos(p.theta),
      Math.sin(lat),
      Math.cos(lat) * Math.sin(p.theta)
    ).multiplyScalar(p.radius);
    p.mesh.position.copy(tmp);
    const ahead = tmp.clone();
    const dir = p.speed > 0 ? 1 : -1;
    ahead.x += -Math.sin(p.theta) * Math.cos(lat) * 0.01 * dir;
    ahead.z += Math.cos(p.theta) * Math.cos(lat) * 0.01 * dir;
    p.mesh.up.set(0, 1, 0).copy(tmp).normalize();
    p.mesh.lookAt(ahead);
    p.mesh.rotateZ(0.25 * Math.sign(p.speed));
    p.mesh.userData.prop.rotation.z -= 28 * dt;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
